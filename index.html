<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>EA Delegation</title>

  <meta name="theme-color" content="#0b0b0f">

  <link rel="manifest" href="./manifest.json">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="EA Delegation">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      background: #0b0b0f;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .app-loader {
      width: 100%;
      max-width: 500px;
      padding: 30px;
      text-align: center;
    }

    .logo {
      width: 84px;
      height: 84px;
      margin: 0 auto 25px;
      border-radius: 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(
        145deg,
        #25252b,
        #08080a
      );

      box-shadow:
        0 18px 50px rgba(0, 0, 0, 0.45);
    }

    .diamond {
      width: 34px;
      height: 34px;

      border: 3px solid #d8b25a;

      transform: rotate(45deg);

      animation: pulse 1.3s ease-in-out infinite;
    }

    @keyframes pulse {
      0% {
        opacity: 0.4;
        transform: rotate(45deg) scale(0.82);
      }

      50% {
        opacity: 1;
        transform: rotate(45deg) scale(1);
      }

      100% {
        opacity: 0.4;
        transform: rotate(45deg) scale(0.82);
      }
    }

    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 8px;
      font-size: 14px;
      color: #9c9ca4;
    }

    .spinner {
      width: 46px;
      height: 46px;

      margin: 30px auto 18px;

      border-radius: 50%;

      border: 4px solid rgba(255, 255, 255, 0.12);
      border-top-color: #d8b25a;

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #status {
      font-size: 13px;
      color: #b3b3ba;
    }

    #manualBox {
      display: none;
      margin-top: 25px;
    }

    #manualBox.show {
      display: block;
    }

    .open-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 46px;
      min-width: 190px;

      padding: 12px 24px;

      background: #d8b25a;
      color: #111111;

      border-radius: 12px;

      font-size: 14px;
      font-weight: 700;

      text-decoration: none;
    }

    .help {
      margin-top: 12px;
      font-size: 11px;
      color: #71717a;
    }
  </style>
</head>

<body>

  <div class="app-loader">

    <div class="logo">
      <div class="diamond"></div>
    </div>

    <h1>EA Delegation</h1>

    <div class="subtitle">
      Loading application...
    </div>

    <div class="spinner"></div>

    <div id="status">
      Preparing application
    </div>

    <div id="manualBox">

      <a
        id="openApp"
        class="open-btn"
        href="#"
      >
        OPEN APPLICATION
      </a>

      <div class="help">
        Click above if the application does not open automatically.
      </div>

    </div>

  </div>


  <script>

    /**********************************************************
     * GOOGLE APPS SCRIPT WEB APP
     **********************************************************/

    const APP_URL =
      "https://script.google.com/macros/s/AKfycbwqGDGSKC06wf6OBpJ6LtU5Dh7DaxmO_aeeXhEWxzZ_1q30qdv2WmdPbPj9GjcMKj2-/exec";


    /**********************************************************
     * REMOVE OLD SERVICE WORKERS
     *
     * Your previous version used a service worker.
     * An old cached version may still contain the iframe.
     **********************************************************/

    async function removeOldServiceWorkers() {

      if (!("serviceWorker" in navigator)) {
        return;
      }

      try {

        const registrations =
          await navigator.serviceWorker.getRegistrations();

        for (const registration of registrations) {

          try {

            await registration.unregister();

          } catch (error) {

            console.log(
              "Could not unregister service worker:",
              error
            );

          }

        }

      } catch (error) {

        console.log(
          "Service worker cleanup error:",
          error
        );

      }

    }


    /**********************************************************
     * DELETE OLD CACHE
     **********************************************************/

    async function clearOldCaches() {

      if (!("caches" in window)) {
        return;
      }

      try {

        const cacheNames =
          await caches.keys();

        for (const cacheName of cacheNames) {

          try {

            await caches.delete(
              cacheName
            );

          } catch (error) {

            console.log(
              "Cache delete error:",
              error
            );

          }

        }

      } catch (error) {

        console.log(
          "Cache cleanup error:",
          error
        );

      }

    }


    /**********************************************************
     * MANUAL BUTTON
     **********************************************************/

    const openAppButton =
      document.getElementById("openApp");

    openAppButton.href =
      APP_URL;


    /**********************************************************
     * START APPLICATION
     **********************************************************/

    async function startApplication() {

      const status =
        document.getElementById("status");

      try {

        status.textContent =
          "Removing old cached version...";


        await removeOldServiceWorkers();

        await clearOldCaches();


        status.textContent =
          "Opening EA Delegation...";


        /*
         * IMPORTANT
         *
         * DO NOT USE:
         *
         * <iframe src="https://script.google.com/...">
         *
         * Google Apps Script blocks external iframe embedding.
         *
         * We redirect the main browser window instead.
         */

        setTimeout(
          function () {

            window.location.replace(
              APP_URL
            );

          },
          300
        );

      } catch (error) {

        console.error(error);

        status.textContent =
          "Click OPEN APPLICATION to continue.";

        document
          .getElementById("manualBox")
          .classList
          .add("show");

      }

    }


    /**********************************************************
     * FALLBACK MANUAL BUTTON
     **********************************************************/

    setTimeout(
      function () {

        document
          .getElementById("manualBox")
          .classList
          .add("show");

      },
      4000
    );


    /**********************************************************
     * RUN
     **********************************************************/

    window.addEventListener(
      "load",
      startApplication
    );

  </script>

</body>

</html>
